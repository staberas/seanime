name: Build Seanime Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Set up Buildx for multi‑arch support (optional)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the image
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.seanime  # or just 'Dockerfile' if that’s the name you use
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/seanime:latest
